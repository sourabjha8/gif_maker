<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Refine Your Selection — Working Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════════
     Design tokens — mirrored 1:1 from design_system.md / app/globals.css
     ══════════════════════════════════════════════════════════════ */
  :root {
    --color-primary-50: #F1F9FE;
    --color-primary-100: #E1F2FD;
    --color-primary-200: #BDE6FA;
    --color-primary-300: #82D3F7;
    --color-primary-400: #3FBDF1;
    --color-primary-500: #17A8E5;
    --color-primary-600: #0A85BF;

    --color-neutral-50: #fafafa;
    --color-neutral-100: #f5f5f5;
    --color-neutral-200: #f0f0f0;
    --color-neutral-300: #d9d9d9;
    --color-neutral-400: #bfbfbf;
    --color-neutral-500: #8c8c8c;
    --color-neutral-600: #595959;
    --color-neutral-700: #434343;

    --color-spatial-bg: #1f1f1f;
    --color-spatial-glass: rgba(18, 18, 18, 0.6);
    --color-spatial-glass-elevated: rgba(255, 255, 255, 0.05);
    --color-spatial-border: rgba(255, 255, 255, 0.1);
    --color-spatial-border-elevated: rgba(255, 255, 255, 0.2);

    --spacing-tight: 8px;
    --spacing-element: 16px;
    --spacing-group: 24px;
    --spacing-container: 40px;

    --radius-element: 12px;
    --radius-card: 24px;
    --radius-container: 32px;
    --radius-pill: 100px;

    --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.4);
    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.16);

    --font-sans: 'Open Sans', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden;
    background-color: var(--color-spatial-bg);
    font-family: var(--font-sans);
    color: var(--color-neutral-50);
  }

  button, input { font-family: var(--font-sans); }
  button { border: none; background: none; padding: 0; color: inherit; }

  /* ── Scrollbar (from .custom-scrollbar in globals.css) ── */
  .scroll::-webkit-scrollbar { width: 12px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb {
    background: var(--color-spatial-border-elevated);
    border-radius: 100px;
    border-right: 6px solid transparent;
    background-clip: padding-box;
  }
  .scroll::-webkit-scrollbar-thumb:hover { background: var(--color-primary-400); }
  .scroll { scrollbar-width: thin; scrollbar-color: var(--color-spatial-border-elevated) transparent; }

  /* ── Typography (matches Typography component's variantMap) ── */
  .t-h2 { font-size: 24px; line-height: 1.2; font-weight: 700; }
  .t-titleLarge { font-size: 16px; line-height: 1.4; font-weight: 400; }
  .t-titleMedium { font-size: 14px; line-height: 1.4; font-weight: 400; }
  .t-titleSmall { font-size: 13px; line-height: 1.4; font-weight: 400; }
  .t-bodyLarge { font-size: 14px; line-height: 1.6; font-weight: 400; }
  .t-bodyMedium { font-size: 14px; line-height: 1.6; font-weight: 400; }
  .t-bodySmall { font-size: 12px; line-height: 1.5; font-weight: 400; }
  @media (min-width: 768px) {
    .t-h2 { font-size: 32px; line-height: 38px; }
    .t-titleLarge { font-size: 18px; line-height: 26px; }
    .t-titleMedium { font-size: 16px; line-height: 24px; }
    .t-titleSmall { font-size: 14px; line-height: 22px; }
    .t-bodyLarge { font-size: 16px; line-height: 24px; }
    .t-bodyMedium { font-size: 14px; line-height: 22px; }
    .t-bodySmall { font-size: 12px; line-height: 18px; }
  }
  .fw-bold { font-weight: 700; }
  .fw-semibold { font-weight: 600; }
  .fw-medium { font-weight: 500; }
  .uppercase { text-transform: uppercase; }
  .tracking-wide { letter-spacing: 0.05em; }

  /* ── Ambient dark showroom background (replaces background.png photo) ── */
  .screen-bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%),
      linear-gradient(180deg, rgba(0,0,10,0.7) 0%, transparent 30%, transparent 70%, rgba(0,0,10,0.9) 100%),
      radial-gradient(ellipse at 30% 20%, #23303a 0%, #14181d 55%, #0b0d10 100%);
  }

  /* ── Layout shell (ScreenLayout) ── */
  .stage {
    position: relative; z-index: 20;
    width: 100%; height: 100%;
    max-width: 1080px; margin: 0 auto;
    padding: 86px 16px 16px;
    display: flex; flex-direction: column; justify-content: center;
  }
  @media (min-width: 768px) { .stage { padding: 40px; } }

  .glass-container {
    background: var(--color-spatial-glass);
    backdrop-filter: blur(64px);
    -webkit-backdrop-filter: blur(64px);
    border: 1px solid var(--color-spatial-border);
    border-radius: var(--radius-container);
    box-shadow: var(--shadow-card);
    width: 100%; max-height: 100%;
    display: flex; flex-direction: column;
    padding: 16px; overflow: hidden;
    animation: reveal 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @media (min-width: 768px) { .glass-container { padding: 40px; } }

  @keyframes reveal {
    0% { opacity: 0; transform: translateY(24px) scale(0.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-in-down {
    0% { opacity: 0; transform: translateY(-16px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ── Step header / indicator ── */
  .step-badge {
    width: 36px; height: 36px; border-radius: var(--radius-element);
    background: var(--color-spatial-glass-elevated);
    border: 1px solid var(--color-spatial-border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-dots { display: none; align-items: center; gap: 8px; }
  @media (min-width: 768px) { .step-dots { display: flex; } }
  .dot { height: 4px; border-radius: var(--radius-pill); background: var(--color-neutral-600); width: 8px; }
  .dot.active { width: 32px; background: #fff; }

  .divider { width: 100%; height: 1px; background: var(--color-spatial-border); margin: 16px 0; flex-shrink: 0; }

  /* ── Filter bar ── */
  .filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }

  .btn-filters {
    display: flex; align-items: center; gap: 8px;
    padding: 0 16px; height: 40px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--color-spatial-border);
    background: var(--color-spatial-glass);
    color: var(--color-neutral-300);
    cursor: pointer; transition: all .2s;
    flex-shrink: 0;
  }
  .btn-filters:hover { border-color: var(--color-spatial-border-elevated); color: #fff; }
  .btn-filters:focus-visible { outline: 2px solid var(--color-primary-500); outline-offset: 2px; }

  .badge-count {
    display: flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 999px; background: var(--color-primary-500);
    color: #fff; font-size: 11px; font-weight: 700; line-height: 1;
  }

  .result-count { color: var(--color-neutral-500); margin-left: auto; padding-left: 16px; white-space: nowrap; }

  /* ── Applied-filter chip row ── */
  .chip-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; margin-top: 16px; animation: fade-in-down .4s ease-out; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 0 10px 0 16px; height: 36px;
    border-radius: var(--radius-pill);
    background: rgba(23,168,229,0.15);
    border: 1px solid rgba(63,189,241,0.5);
    color: var(--color-primary-200);
    cursor: pointer; transition: background .2s;
  }
  .chip:hover { background: rgba(23,168,229,0.25); }
  .chip .x { width: 10px; height: 10px; opacity: .8; }
  .clear-all-text {
    padding: 0 16px; height: 36px; display: flex; align-items: center;
    color: var(--color-neutral-400); cursor: pointer; border-radius: var(--radius-pill);
    background: none; transition: color .2s;
  }
  .clear-all-text:hover { color: #fff; }

  /* ── Results grid ── */
  .results-wrap { flex: 1; overflow-y: auto; margin-top: 16px; min-height: 0; padding-right: 4px; }
  .results-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding-bottom: 8px;
    animation: fade-in-down .4s ease-out;
  }
  @media (min-width: 640px) { .results-grid { grid-template-columns: repeat(3, 1fr); } }

  /* ── Room design card (mirrors RoomCard.tsx exactly) ── */
  .room-card {
    position: relative; width: 100%; height: 0; padding-bottom: 70%;
    border-radius: var(--radius-element); overflow: hidden;
    border: 1px solid transparent; cursor: pointer; text-align: left;
    transition: border-color .3s, box-shadow .3s;
  }
  .room-card:hover { border-color: var(--color-spatial-border-elevated); }
  .room-card.selected { border-color: var(--color-primary-400); box-shadow: 0 0 16px rgba(63,189,241,0.4); }
  .room-card:focus-visible { outline: 2px solid var(--color-primary-500); outline-offset: 2px; }

  .card-art { position: absolute; inset: 0; transition: transform .5s; }
  .room-card:hover .card-art { transform: scale(1.05); }

  .card-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.2) 60%, transparent);
    transition: background .3s; pointer-events: none;
  }
  .room-card:hover .card-gradient { background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.7) 55%, rgba(0,0,0,0.3)); }

  .card-top { display: none; flex-direction: column; position: absolute; top: 16px; left: 16px; right: 16px; }
  @media (min-width: 768px) { .card-top { display: flex; } }
  .card-top-row { display: flex; align-items: center; gap: 8px; }
  .card-icon {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: var(--radius-element);
    background: rgba(0,0,0,0.3); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
  }
  .card-icon img { width: 16px; height: 16px; opacity: .7; }
  .card-title-hover {
    font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateY(16px);
    transition: all .3s ease-out;
  }
  .room-card:hover .card-title-hover { opacity: 1; transform: translateY(0); }

  .card-assets {
    margin-top: 16px; opacity: 0; transform: translateY(16px);
    transition: all .3s ease-out .075s; pointer-events: none;
  }
  .room-card:hover .card-assets { opacity: 1; transform: translateY(0); }
  .card-assets ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .card-assets li { display: flex; align-items: center; gap: 6px; color: var(--color-neutral-200); }
  .card-assets .bullet { width: 4px; height: 4px; border-radius: 50%; background: var(--color-primary-400); flex-shrink: 0; }
  .card-assets .label { font-size: 12px; line-height: 18px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-assets .more { display: block; font-size: 12px; line-height: 18px; font-weight: 500; color: var(--color-primary-300); margin-top: 2px; }

  .card-bottom {
    position: absolute; bottom: 4px; left: 8px; right: 8px;
    transition: all .3s ease-out;
  }
  @media (min-width: 768px) { .card-bottom { bottom: 16px; left: 16px; right: 16px; } }
  .room-card:hover .card-bottom { }
  @media (min-width: 768px) {
    .room-card:hover .card-bottom { opacity: 0; transform: translateY(-12px); }
  }
  .card-bottom .name { font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card-selected-glow { position: absolute; inset: 0; background: rgba(23,168,229,0.1); pointer-events: none; animation: fade-in .3s; }

  /* ── Zero-results state ── */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; text-align: center; padding: 48px 0; }
  .btn-clear-facet {
    padding: 0 16px; height: 40px; border-radius: var(--radius-pill);
    border: 1px solid var(--color-spatial-border); background: var(--color-spatial-glass);
    color: var(--color-neutral-300); cursor: pointer; transition: all .2s;
  }
  .btn-clear-facet:hover { border-color: var(--color-spatial-border-elevated); color: #fff; }
  .btn-clear-all-primary {
    padding: 0 24px; height: 40px; border-radius: var(--radius-pill);
    background: var(--color-primary-500); color: #fff; font-weight: 700;
    cursor: pointer; box-shadow: var(--shadow-card); border: none; transition: background .2s;
  }
  .btn-clear-all-primary:hover { background: var(--color-primary-400); }

  /* ── Footer (ActionFooter) ── */
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--color-spatial-border);
    flex-shrink: 0;
  }
  @media (min-width: 768px) { .footer { margin-top: 24px; padding-top: 24px; } }
  .btn-back {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 44px; height: 44px; padding: 0;
    border-radius: var(--radius-pill); border: 1px solid var(--color-spatial-border);
    background: transparent; color: var(--color-neutral-300); cursor: pointer; transition: all .2s;
  }
  .btn-back:hover { border-color: var(--color-spatial-border-elevated); color: #fff; }
  @media (min-width: 768px) { .btn-back { width: auto; padding: 0 16px; } }
  .btn-back span.label { display: none; }
  @media (min-width: 768px) { .btn-back span.label { display: inline; } }

  .btn-primary {
    display: flex; align-items: center; gap: 8px;
    padding: 0 24px; height: 44px; border-radius: var(--radius-pill);
    font-weight: 700; cursor: pointer; transition: all .2s; border: none;
    background: var(--color-primary-500); color: #fff; box-shadow: var(--shadow-card);
  }
  .btn-primary:hover:not(:disabled) { background: var(--color-primary-400); }
  .btn-primary:disabled { background: var(--color-neutral-700); color: var(--color-neutral-400); cursor: not-allowed; opacity: .6; }

  /* ── Filters slide-over drawer ── */
  .drawer-backdrop {
    position: fixed; inset: 0; z-index: 150; background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; z-index: 160; top: 0; right: 0; height: 100%;
    width: min(380px, 90vw);
    display: flex; flex-direction: column;
    background: var(--color-spatial-glass);
    backdrop-filter: blur(64px); -webkit-backdrop-filter: blur(64px);
    border-left: 1px solid var(--color-spatial-border);
    box-shadow: var(--shadow-modal);
    transform: translateX(100%);
    transition: transform .3s ease-out;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px; border-bottom: 1px solid var(--color-spatial-border); flex-shrink: 0;
  }
  .drawer-header-title { display: flex; align-items: center; gap: 8px; }
  .btn-close {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-element); border: 1px solid var(--color-spatial-border);
    background: var(--color-spatial-glass-elevated); color: var(--color-neutral-300);
    cursor: pointer; transition: all .2s;
  }
  .btn-close:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .btn-close img { width: 14px; height: 14px; opacity: .7; }

  .drawer-body { flex: 1; overflow-y: auto; padding: 0 40px; }

  .accordion { border-bottom: 1px solid var(--color-spatial-border); }
  .accordion-trigger {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 16px 0; min-height: 44px; text-align: left; cursor: pointer;
    background: none; border: none; color: inherit;
  }
  .accordion-trigger:focus-visible { outline: 2px solid var(--color-primary-500); }
  .accordion-label-row { display: flex; align-items: center; gap: 8px; }
  .accordion-label { color: var(--color-neutral-200); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .chevron { width: 16px; height: 16px; opacity: .6; transition: transform .2s; }
  .chevron.rotated { transform: rotate(180deg); }
  .accordion-panel { padding-bottom: 16px; }

  .checkbox-row {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 8px; border-radius: var(--radius-element); min-height: 44px;
    text-align: left; cursor: pointer; background: none; border: none; color: inherit;
    transition: background .2s;
  }
  .checkbox-row:hover { background: rgba(255,255,255,0.05); }
  .checkbox-row.checked { background: rgba(23,168,229,0.1); }
  .checkbox-row:focus-visible { outline: 2px solid var(--color-primary-500); }
  .checkbox-box {
    display: flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--color-spatial-border-elevated);
    font-size: 11px; font-weight: 700; line-height: 1; flex-shrink: 0; color: transparent; background: transparent;
    transition: all .2s;
  }
  .checkbox-row.checked .checkbox-box { background: var(--color-primary-500); border-color: var(--color-primary-400); color: #fff; }
  .checkbox-label { color: var(--color-neutral-300); }
  .checkbox-row.checked .checkbox-label { color: var(--color-neutral-100); }

  .drawer-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 40px; border-top: 1px solid var(--color-spatial-border); flex-shrink: 0;
  }
  .btn-drawer-clear {
    padding: 0 16px; height: 44px; border-radius: var(--radius-pill);
    background: none; border: none; color: var(--color-neutral-300); cursor: pointer; transition: color .2s;
  }
  .btn-drawer-clear:hover:not(:disabled) { color: #fff; }
  .btn-drawer-clear:disabled { color: var(--color-neutral-600); cursor: not-allowed; }
  .btn-drawer-show {
    flex: 1; max-width: 220px; height: 44px; border-radius: var(--radius-pill);
    background: var(--color-primary-500); color: #fff; font-weight: 700;
    cursor: pointer; box-shadow: var(--shadow-card); border: none; transition: background .2s;
  }
  .btn-drawer-show:hover { background: var(--color-primary-400); }

  /* ── Loading overlay ── */
  .loading-overlay {
    position: fixed; inset: 0; z-index: 200; background: #000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    animation: fade-in .3s;
  }
  .loading-overlay.visible { display: flex; }
  .spinner {
    width: 64px; height: 64px; border-radius: 50%;
    border: 4px solid rgba(23,168,229,0.2); border-top-color: var(--color-primary-500);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { margin-top: 24px; color: #fff; font-weight: 500; letter-spacing: 0.03em; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }

  /* ── Explore confirmation toast (prototype-only, not in real app) ── */
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    z-index: 210; max-width: 90vw;
    background: var(--color-spatial-glass); backdrop-filter: blur(64px);
    border: 1px solid var(--color-spatial-border-elevated); border-radius: var(--radius-card);
    box-shadow: var(--shadow-modal); padding: 16px 24px;
    opacity: 0; pointer-events: none; transition: all .3s ease-out;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast code { color: var(--color-primary-300); font-size: 12px; }

  /* ── Prototype-only banner ── */
  .proto-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 300;
    background: #111; color: var(--color-neutral-400); font-size: 12px;
    text-align: center; padding: 6px; border-bottom: 1px solid var(--color-spatial-border);
  }
  .proto-banner b { color: var(--color-primary-300); }
</style>
</head>
<body>

<div class="proto-banner">Working prototype — <b>Refine Your Selection</b> screen, sample data. Click a card, open Filters, tap "Explore Design".</div>

<div class="screen-bg" aria-hidden="true"></div>

<div class="stage">
  <div class="glass-container">

    <!-- ─── Step header ─── -->
    <div style="display:flex; flex-direction:column; gap:16px; flex-shrink:0;">
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; align-items:center; gap:16px;">
          <div class="step-badge">

<script>
(function () {
  'use strict';

  // ═══ Sample data (living-room, mirrors virtual-xp-content.json) ═══
  var FACETS = [
    { key: 'designStyle', label: 'Style',     options: ['contemporary','industrial','minimalist','modern','scandinavian','traditional'] },
    { key: 'moduleType',  label: 'Package',   options: ['standard','modular','custom'] },
    { key: 'luxuryLevel', label: 'Grade',     options: ['essential','premium','signature'] },
    { key: 'roomSize',    label: 'Room Size', options: ['small','medium','large'] }
  ];

  var GRADIENTS = {
    modern:       'linear-gradient(135deg, #33424f 0%, #182027 100%)',
    contemporary: 'linear-gradient(135deg, #4a3f35 0%, #221c17 100%)',
    industrial:   'linear-gradient(135deg, #3d3d3d 0%, #17171799 100%), linear-gradient(135deg,#3a3a3a,#1a1a1a)',
    traditional:  'linear-gradient(135deg, #5c4326 0%, #241a0e 100%)',
    minimalist:   'linear-gradient(135deg, #454545 0%, #232323 100%)',
    scandinavian: 'linear-gradient(135deg, #4a463a 0%, #201e19 100%)'
  };

  var VARIANTS = [
    { slug: 'modern-minimal', name: 'Modern Minimal', designStyle: 'modern',       moduleType: 'modular',  luxuryLevel: 'premium',   roomSize: 'large',  assets: ['Modular Sofa','Oak Console','Linen Drapes'] },
    { slug: 'modern-beige',   name: 'Modern Beige',    designStyle: 'modern',       moduleType: 'modular',  luxuryLevel: 'premium',   roomSize: 'large',  assets: ['Beige Sectional','Marble Coffee Table'] },
    { slug: 'contemporary',   name: 'Contemporary',    designStyle: 'contemporary', moduleType: 'modular',  luxuryLevel: 'premium',   roomSize: 'large',  assets: ['Curved Sofa','Brass Floor Lamp','Accent Rug'] },
    { slug: 'industrial',     name: 'Industrial',      designStyle: 'industrial',   moduleType: 'custom',   luxuryLevel: 'essential', roomSize: 'medium', assets: ['Leather Sofa','Iron-Frame Shelving'] },
    { slug: 'traditional',    name: 'Traditional',     designStyle: 'traditional',  moduleType: 'modular',  luxuryLevel: 'signature', roomSize: 'large',  assets: ['Carved Wood Console','Damask Drapes','Chesterfield Sofa'] },
    { slug: 'minimalist',     name: 'Minimalist',      designStyle: 'minimalist',   moduleType: 'standard', luxuryLevel: 'essential', roomSize: 'small',  assets: ['Low-Profile Sofa','Floating Shelf'] },
    { slug: 'scandinavian',   name: 'Scandinavian',    designStyle: 'scandinavian', moduleType: 'modular',  luxuryLevel: 'premium',   roomSize: 'medium', assets: ['Pale Wood Console','Wool Throw','Boucle Chair'] }
  ];

  function titleCase(v) { return v.replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }

  // ═══ State (mirrors RoomFilterSelection.tsx) ═══
  var selections = {};        // facetKey -> array of selected values
  var selectedVariantId = null;
  var drawerOpen = false;
  var accordionOpen = { designStyle: true, moduleType: false, luxuryLevel: false, roomSize: false };

  function countSelected() {
    var total = 0;
    Object.keys(selections).forEach(function (k) { total += (selections[k] || []).length; });
    return total;
  }

  function filterResults() {
    var activeKeys = Object.keys(selections).filter(function (k) { return selections[k] && selections[k].length; });
    if (!activeKeys.length) return VARIANTS.slice();
    return VARIANTS.filter(function (v) {
      return activeKeys.every(function (k) { return selections[k].indexOf(v[k]) !== -1; });
    });
  }

  function toggleValue(key, value) {
    var current = selections[key] || [];
    var idx = current.indexOf(value);
    var next = idx === -1 ? current.concat(value) : current.filter(function (v) { return v !== value; });
    if (next.length) selections[key] = next; else delete selections[key];
    onSelectionsChanged();
  }

  function clearFacet(key) { delete selections[key]; onSelectionsChanged(); }
  function clearAll() { selections = {}; onSelectionsChanged(); }

  function onSelectionsChanged() {
    var results = filterResults();
    if (selectedVariantId && !results.some(function (v) { return v.slug === selectedVariantId; })) {
      selectedVariantId = null;
    }
    render();
  }

  // ═══ Rendering ═══
  var els = {
    filtersBadge: document.getElementById('filtersBadge'),
    resultCount: document.getElementById('resultCount'),
    chipRow: document.getElementById('chipRow'),
    resultsArea: document.getElementById('resultsArea'),
    exploreBtn: document.getElementById('exploreBtn'),
    drawerBadge: document.getElementById('drawerBadge'),
    accordions: document.getElementById('accordions'),
    drawerClearAll: document.getElementById('drawerClearAll'),
    drawerShow: document.getElementById('drawerShow'),
    drawerShowCount: document.getElementById('drawerShowCount'),
    drawer: document.getElementById('drawer'),
    drawerBackdrop: document.getElementById('drawerBackdrop')
  };

  function renderCard(variant) {
    var isSelected = selectedVariantId === variant.slug;
    var assets = variant.assets || [];
    var visible = assets.slice(0, 4);
    var remaining = assets.length - visible.length;

    var assetsHtml = visible.map(function (a) {
      return '<li><span class="bullet"></span><span class="label">' + a + '</span></li>';
    }).join('');
    var moreHtml = remaining > 0 ? '<span class="more">+' + remaining + ' more</span>' : '';

    var card = document.createElement('div');
    card.className = 'room-card' + (isSelected ? ' selected' : '');
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.innerHTML =
      '<div class="card-art" style="background:' + (GRADIENTS[variant.designStyle] || GRADIENTS.modern) + ';"></div>' +
      '<div class="card-gradient"></div>' +
      '<div class="card-top">' +
        '<div class="card-top-row">' +
          '<div class="card-icon"><svg width="16" height="16" viewBox="0 -960 960 960" fill="#e8eaed" style="opacity:.7"><path d="M106-386q-6-6-6-14t6-14q6-6 14-6t14 6q6 6 6 14t-6 14q-6 6-14 6t-14-6Zm107.62 172.38q-10.54-10.53-10.54-26.38t10.54-26.38q10.53-10.54 26.38-10.54t26.38 10.54q10.54 10.53 10.54 26.38t-10.54 26.38q-10.53 10.54-26.38 10.54t-26.38-10.54Z"/></svg></div>' +
          '<span class="card-title-hover t-titleMedium">' + variant.name + '</span>' +
        '</div>' +
        '<div class="card-assets"><ul>' + assetsHtml + '</ul>' + moreHtml + '</div>' +
      '</div>' +
      '<div class="card-bottom"><span class="name t-titleMedium">' + variant.name + '</span></div>' +
      (isSelected ? '<div class="card-selected-glow"></div>' : '');

    card.addEventListener('click', function () {
      selectedVariantId = (selectedVariantId === variant.slug) ? null : variant.slug;
      render();
    });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') card.click();
    });
    return card;
  }

  function render() {
    var results = filterResults();
    var total = countSelected();

    // Filters button badge
    els.filtersBadge.style.display = total > 0 ? 'flex' : 'none';
    els.filtersBadge.textContent = total;

    // Result count
    els.resultCount.textContent = results.length + (results.length === 1 ? ' design' : ' designs');

    // Chip row
    els.chipRow.innerHTML = '';
    var activeChips = [];
    FACETS.forEach(function (f) { (selections[f.key] || []).forEach(function (v) { activeChips.push({ key: f.key, value: v }); }); });
    if (activeChips.length) {
      els.chipRow.style.display = 'flex';
      activeChips.forEach(function (c) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip t-bodySmall fw-medium';
        chip.innerHTML = '<span>' + titleCase(c.value) + '</span><svg class="x" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-437.85 277.08-234.92q-8.31 8.3-20.89 8.5-12.57.19-21.27-8.5-8.69-8.7-8.69-21.08 0-12.38 8.69-21.08L437.85-480 234.92-682.92q-8.3-8.31-8.5-20.89-.19-12.57 8.5-21.27 8.7-8.69 21.08-8.69 12.38 0 21.08 8.69L480-522.15l202.92-202.93q8.31-8.3 20.89-8.5 12.57-.19 21.27 8.5 8.69 8.7 8.69 21.08 0 12.38-8.69 21.08L522.15-480l202.93 202.92q8.3 8.31 8.5 20.89.19 12.57-8.5 21.27-8.7 8.69-21.08 8.69-12.38 0-21.08-8.69L480-437.85Z"/></svg>';
        chip.addEventListener('click', function () { toggleValue(c.key, c.value); });
        els.chipRow.appendChild(chip);
      });
      var clearAllChip = document.createElement('button');
      clearAllChip.type = 'button';
      clearAllChip.className = 'clear-all-text t-bodySmall fw-medium';
      clearAllChip.textContent = 'Clear all';
      clearAllChip.addEventListener('click', clearAll);
      els.chipRow.appendChild(clearAllChip);
    } else {
      els.chipRow.style.display = 'none';
    }

    // Results grid / empty state
    els.resultsArea.innerHTML = '';
    if (results.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      var activeFacets = FACETS.filter(function (f) { return (selections[f.key] || []).length > 0; });
      var buttonsHtml = activeFacets.map(function (f) {
        return '<button type="button" class="btn-clear-facet t-bodySmall fw-medium" data-clear-facet="' + f.key + '">Clear ' + f.label + ' filter</button>';
      }).join('');
      empty.innerHTML =
        '<div class="t-titleMedium fw-semibold" style="color:var(--color-neutral-300);">No designs match these filters</div>' +
        '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;">' +
          buttonsHtml +
          '<button type="button" class="btn-clear-all-primary t-bodySmall" id="emptyClearAll">Clear all</button>' +
        '</div>';
      els.resultsArea.appendChild(empty);
      empty.querySelectorAll('[data-clear-facet]').forEach(function (btn) {
        btn.addEventListener('click', function () { clearFacet(btn.getAttribute('data-clear-facet')); });
      });
      empty.querySelector('#emptyClearAll').addEventListener('click', clearAll);
    } else {
      var grid = document.createElement('div');
      grid.className = 'results-grid';
      results.forEach(function (v) { grid.appendChild(renderCard(v)); });
      els.resultsArea.appendChild(grid);
    }

    // Explore CTA
    els.exploreBtn.disabled = !selectedVariantId;

    // Drawer badge + accordions + footer
    els.drawerBadge.style.display = total > 0 ? 'flex' : 'none';
    els.drawerBadge.textContent = total;
    els.drawerClearAll.disabled = total === 0;
    els.drawerShowCount.textContent = results.length;

    els.accordions.innerHTML = '';
    FACETS.forEach(function (f) {
      var sel = selections[f.key] || [];
      var section = document.createElement('section');
      section.className = 'accordion';
      var isOpen = accordionOpen[f.key];
      var optionsHtml = f.options.map(function (o) {
        var checked = sel.indexOf(o) !== -1;
        return '<button type="button" role="checkbox" aria-checked="' + checked + '" class="checkbox-row t-bodyMedium' + (checked ? ' checked' : '') + '" data-facet="' + f.key + '" data-value="' + o + '">' +
          '<span class="checkbox-box">✓</span><span class="checkbox-label">' + titleCase(o) + '</span></button>';
      }).join('');
      section.innerHTML =
        '<button type="button" class="accordion-trigger" aria-expanded="' + isOpen + '" data-toggle-facet="' + f.key + '">' +
          '<span class="accordion-label-row"><span class="accordion-label t-titleSmall">' + f.label + '</span>' +
          (sel.length ? '<span class="badge-count">' + sel.length + '</span>' : '') + '</span>' +
          '<svg class="chevron' + (isOpen ? ' rotated' : '') + '" viewBox="0 0 24 24" fill="none"><path d="M12 12.9463L16.073 8.87301C16.2115 8.73468 16.3856 8.66385 16.5952 8.66051C16.8047 8.65735 16.982 8.72818 17.127 8.87301C17.2718 9.01801 17.3442 9.19368 17.3442 9.40001C17.3442 9.60635 17.2718 9.78201 17.127 9.92701L12.6327 14.4213C12.5391 14.5148 12.4403 14.5808 12.3365 14.6193C12.2327 14.6578 12.1205 14.677 12 14.677C11.8795 14.677 11.7673 14.6578 11.6635 14.6193C11.5597 14.5808 11.4609 14.5148 11.3672 14.4213L6.87299 9.92701C6.73465 9.78851 6.66382 9.61443 6.66049 9.40476C6.65732 9.19526 6.72815 9.01801 6.87299 8.87301C7.01799 8.72818 7.19365 8.65576 7.39999 8.65576C7.60632 8.65576 7.78199 8.72818 7.92699 8.87301L12 12.9463Z" fill="#E8EAED"/></svg>' +
        '</button>' +
        (isOpen ? '<div class="accordion-panel">' + optionsHtml + '</div>' : '');
      els.accordions.appendChild(section);
    });

    els.accordions.querySelectorAll('[data-toggle-facet]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-toggle-facet');
        accordionOpen[key] = !accordionOpen[key];
        render();
      });
    });
    els.accordions.querySelectorAll('[data-facet][data-value]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        toggleValue(btn.getAttribute('data-facet'), btn.getAttribute('data-value'));
      });
    });
  }

  // ═══ Drawer open/close ═══
  function openDrawer() {
    drawerOpen = true;
    els.drawer.classList.add('open');
    els.drawerBackdrop.classList.add('open');
  }
  function closeDrawer() {
    drawerOpen = false;
    els.drawer.classList.remove('open');
    els.drawerBackdrop.classList.remove('open');
  }
  document.getElementById('filtersBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
  els.drawerBackdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawerOpen) closeDrawer(); });
  els.drawerClearAll.addEventListener('click', clearAll);
  els.drawerShow.addEventListener('click', closeDrawer);

  // ═══ Explore Design (mirrors handleExplore: simulated 2.5s delay) ═══
  var loadingOverlay = document.getElementById('loadingOverlay');
  var toast = document.getElementById('toast');
  els.exploreBtn.addEventListener('click', function () {
    var variant = VARIANTS.find ? VARIANTS.find(function (v) { return v.slug === selectedVariantId; }) : null;
    if (!variant) return;
    loadingOverlay.classList.add('visible');
    setTimeout(function () {
      loadingOverlay.classList.remove('visible');
      var filters = { designStyle: variant.designStyle, moduleType: variant.moduleType, luxuryLevel: variant.luxuryLevel, roomSize: variant.roomSize };
      toast.innerHTML = 'Would continue to tour with <b>' + variant.name + '</b> — <code>' +
        Object.keys(filters).map(function (k) { return k + '=' + filters[k]; }).join('&') + '</code>';
      toast.classList.add('visible');
      setTimeout(function () { toast.classList.remove('visible'); }, 4000);
    }, 2500);
  });

  document.getElementById('backBtn').addEventListener('click', function () {
    toast.textContent = 'Would navigate back to /room-type';
    toast.classList.add('visible');
    setTimeout(function () { toast.classList.remove('visible'); }, 2000);
  });

  render();
})();
</script>

</body>
</html>
